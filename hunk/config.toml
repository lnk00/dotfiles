theme = "eink"
mode = "stack"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"

# >>> eink theme (generated -- edit ~/.config/theme/eink-dark.toml) >>>
[themes.eink]
base = "github-light"
label = "E-Ink"
background = "#17150d"
panel = "#17150d"
panelAlt = "#222018"
border = "#46443d"
accent = "#e3e3e1"
accentMuted = "#a7a5a1"
text = "#e3e3e1"
muted = "#989792"
addedBg = "#d4d3d0"
removedBg = "#b6b4b1"
movedAddedBg = "#c5c4c0"
movedRemovedBg = "#a7a5a1"
contextBg = "#17150d"
addedContentBg = "#c5c4c0"
removedContentBg = "#a7a5a1"
contextContentBg = "#17150d"
addedSignColor = "#e3e3e1"
removedSignColor = "#a7a5a1"
lineNumberBg = "#17150d"
lineNumberFg = "#605e58"
selectedHunk = "#2e2b24"
badgeAdded = "#e3e3e1"
badgeRemoved = "#a7a5a1"
badgeNeutral = "#989792"
fileNew = "#e3e3e1"
fileDeleted = "#a7a5a1"
fileRenamed = "#c5c4c0"
fileModified = "#e3e3e1"
fileUntracked = "#989792"
noteBorder = "#46443d"
noteBackground = "#222018"
noteTitleBackground = "#2e2b24"
noteTitleText = "#e3e3e1"

[themes.eink.syntaxScopes]
"comment" = "#989792"
"string" = "#c5c4c0"
"keyword" = "#e3e3e1"
"entity.name.function" = "#e3e3e1"
"entity.name.type" = "#e3e3e1"
"constant.numeric" = "#c5c4c0"
"constant.language" = "#c5c4c0"
"variable" = "#e3e3e1"
"variable.parameter" = "#c5c4c0"
"punctuation" = "#a7a5a1"
"keyword.operator" = "#c5c4c0"
"invalid" = "#e88b82"
