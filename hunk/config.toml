panelAlt = "#efeadb"
border = "#c0bcb0"
accent = "#282826"
accentMuted = "#5b5954"
text = "#282826"
muted = "#686661"
addedBg = "#efeadb"
removedBg = "#cfcbbf"
movedAddedBg = "#dfdbcd"
movedRemovedBg = "#c0bcb0"
contextBg = "#fffaea"
addedContentBg = "#dfdbcd"
removedContentBg = "#c0bcb0"
contextContentBg = "#fffaea"
addedSignColor = "#282826"
removedSignColor = "#5b5954"
lineNumberBg = "#fffaea"
lineNumberFg = "#a29f95"
selectedHunk = "#dfdbcd"
badgeAdded = "#282826"
badgeRemoved = "#5b5954"
badgeNeutral = "#686661"
fileNew = "#282826"
