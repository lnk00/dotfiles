theme = "eink"
mode = "stack"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"

# >>> eink theme (generated -- edit ~/.config/theme/eink.toml) >>>
[themes.eink]
base = "github-light"
label = "E-Ink"
background = "#fffaea"
