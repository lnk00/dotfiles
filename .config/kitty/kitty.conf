# kitty. Palette lives in themes/, same split as ~/.config/alacritty.
include themes/e-ink-dark.conf

# --- font ---------------------------------------------------------------
# Same face and size as alacritty, so switching terminal does not reflow a
# tmux/nvim layout. GeistMono is the *desktop* face (jay bar, mako); the
# terminals stay on JetBrains Mono. Note `bold_font auto` picks SemiBold out of this
# family while alacritty asks for Bold by name, so all four faces are pinned
# rather than left to disagree about what bold weighs.
font_family      family="JetBrainsMono Nerd Font Mono" style="Regular"
bold_font        family="JetBrainsMono Nerd Font Mono" style="Bold"
italic_font      family="JetBrainsMono Nerd Font Mono" style="Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="Bold Italic"
font_size        12.0

# --- cursor -------------------------------------------------------------
# Cursor trail. The number is a threshold in milliseconds, not a duration:
# only a cursor that has been parked somewhere for longer than this leaves a
# trail when it moves. It exists to suppress trails during full-screen redraws
# in TUIs -- without it every nvim scroll and every lazygit repaint smears.
# 8ms is low enough that ordinary jumps (a motion, a prompt, a pane switch)
# all trail, while a repaint storm does not.
cursor_trail 8

# Fastest and slowest decay in seconds: short hops fade in 0.15s, long jumps
# across the screen linger for 0.5s. Both are a touch slower than kitty's
# 0.1/0.4 default, which suits the theme -- e-ink ghosting is the one thing
# real e-paper does that a pixel display has to fake.
cursor_trail_decay 0.15 0.5

# Minimum cells moved before a trail starts. At 2, typing a line or walking
# with h/l never trails; a jump does. Drop to 1 for a trail on every single
# keystroke.
cursor_trail_start_threshold 2

# Blink off: a blinking cursor repeatedly re-fires the trail's start threshold
# logic against a cursor that is not moving, and a static block is closer to
# ink on a page anyway.
cursor_shape block
cursor_blink_interval 0

# kitty's shell integration resets the cursor to a beam at every prompt, which
# would quietly override the block above. `no-cursor` keeps the rest of the
# integration (jump-to-prompt, exit codes) and only drops the cursor meddling.
shell_integration no-cursor

# --- keys ---------------------------------------------------------------
# Shift+Enter as ESC CR, matching the alacritty binding. kitty's own keyboard
# protocol already reports shift+enter to apps that ask for it; this is the
# fallback for the ones that do not.
map shift+enter send_text all \x1b\r

# ctrl+shift+u opens a URL hint in qutebrowser, same key as the alacritty hint
# binding. (kitty's built-in ctrl+shift+e still works too.)
open_url_with qutebrowser
map ctrl+shift+u open_url_with_hints

# ...but ctrl+shift+u is kitty's own unicode-input key, and when two mappings
# land on one key kitty silently takes the last one (keys.py: matches[-1]).
# Rebind it rather than lose it to a shadow -- it is the only binding the
# unicode_input kitten has on Linux.
map ctrl+shift+alt+u kitten unicode_input

# --- scrollback: the alacritty vi-mode replacement ----------------------
# kitty has no vi mode and upstream has declined to add one -- there is no
# keyboard-movable text cursor and no keyboard selection action in the whole
# API, so it cannot be rebuilt out of keyboard_modes either. The sanctioned
# answer is to hand the buffer to a real editor instead, which is strictly
# more than alacritty's vi mode: this is actual nvim, with this machine's
# config, the e-ink colorscheme, flash.nvim, registers and the system
# clipboard, over the scrollback.
#
# The invocation is kitty's own documented one for nvim 0.12+ (this box runs
# 0.12.5, so it qualifies):
#   --cmd 'set eventignore=FileType'  loads the config but suppresses FileType
#       autocmds, so no LSP client attaches to a throwaway buffer
#   call nvim_open_term(0, {})        renders the piped ANSI colours instead
#       of showing them as escape-sequence noise
#   nnoremap q ZQ                     quits on a bare q, like less
#   $                                 opens at the bottom, where the cursor is
# Measured: ~57ms to first paint with the full config, vs ~10ms for -u NONE.
# Not worth stripping the config for 47ms.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# Same key as the alacritty vi-mode toggle. kitty leaves ctrl+shift+space
# unbound by default, so this displaces nothing, and the stock ctrl+shift+h
# still does the same thing.
map ctrl+shift+space show_scrollback

# alacritty's history default is 10000 lines and this setup never overrode it;
# kitty's is 2000. Match it, or ctrl+shift+space reaches a fifth as far back.
scrollback_lines 10000

# A second, larger buffer that ONLY the pager ever sees -- interactive
# scrolling cannot reach it, so it costs nothing per window. 10MB is roughly
# 100k lines, which is what makes the pager worth opening for a long build log.
scrollback_pager_history_size 10

# Three stock bindings that come free with the same pager and are worth
# knowing, all of them things alacritty's vi mode cannot do:
#   ctrl+shift+g  just the last command's output, no hunting for the prompt
#   ctrl+shift+/  opens the pager and sends / to start an nvim search
#   ctrl+shift+z / ctrl+shift+x  jump to the previous / next shell prompt
# All four need shell integration, which is on (no-cursor only drops the
# cursor-shape meddling).

# --- window -------------------------------------------------------------
# Nothing on this desktop is rounded and nothing has a gap; jay draws the
# title bar and the borders, so kitty only pads its own text.
window_padding_width 4
window_border_width  0
confirm_os_window_close 0

# jay tiles, so kitty's tab bar is rarely used -- keep it flat and out of the
# way when it does appear.
tab_bar_style   separator
tab_bar_edge    top
tab_separator   " │ "
tab_title_template "{index}:{title}"

# --- bell ---------------------------------------------------------------
# mako already handles anything that deserves attention.
enable_audio_bell no
visual_bell_duration 0.0
