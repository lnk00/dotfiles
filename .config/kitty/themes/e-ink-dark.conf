# e-ink dark for kitty
# Ported from https://github.com/e-ink-colorscheme/e-ink.nvim
# (lua/e-ink/palette.lua mono.dark + everforest.dark, mirroring the
# terminal_color_0-15 mapping in lua/e-ink/syntax.lua), and kept byte-identical
# to ~/.config/alacritty/themes/e-ink-dark.toml so both terminals render the
# same buffer the same way.
#
# Same principle as the mako theme and jay's [theme] block: a greyscale ramp
# carries all structure, and the muted everforest accents are spent only where
# a colour means something.
#
#   mono:   #333333 #474747 #4a4a4a #545454 #7c7c7c #868686 #9a9a9a #a4a4a4
#           #b8b8b8 #cccccc
#   accent: #e67e80 red  #e69875 orange  #a7c080 green  #dbbc7f yellow
#           #7fbbb3 blue  #d699b6 magenta  #83c092 cyan

# --- page ---------------------------------------------------------------
# #333333 is the same ink-on-paper base as jay's bg-color, so a kitty window
# with no content is indistinguishable from bare desktop.
foreground              #a4a4a4
background              #333333
background_opacity      1.0

selection_foreground    #333333
selection_background    #545454

# --- cursor -------------------------------------------------------------
# Cursor colours live here with the rest of the palette; the trail *timing*
# lives in kitty.conf next to the other behaviour settings.
cursor                  #cccccc
cursor_text_color       #333333

# The trail is deliberately dimmer than the cursor itself (#868686, the same
# grey as an unfocused jay border). On a real e-ink panel the smear left
# behind a moving element is a faded ghost of it, never as dark as the thing
# casting it -- a trail at full #cccccc reads as a second cursor instead.
cursor_trail_color      #868686

# Links are the one piece of chrome allowed an accent: blue, underlined only
# on hover.
url_color               #7fbbb3
url_style               curly

# --- the 16 ANSI slots --------------------------------------------------
# 0/7 and 8/15 are four steps of the grey ramp, not black and white -- nothing
# on this palette reaches #000 or #fff.
color0  #333333
color8  #868686
color7  #7c7c7c
color15 #cccccc

# 1-6 and 9-14 are identical: everforest has one tone per hue here, and
# doubling it keeps `bold` from silently shifting a colour's meaning.
color1  #e67e80
color9  #e67e80
color2  #a7c080
color10 #a7c080
color3  #dbbc7f
color11 #dbbc7f
color4  #7fbbb3
color12 #7fbbb3
color5  #d699b6
color13 #d699b6
color6  #83c092
color14 #83c092

# --- window chrome ------------------------------------------------------
# Borders and tabs reuse jay's focused/unfocused pair exactly, so a kitty
# split and a tiled window read as the same kind of edge.
active_border_color     #cccccc
inactive_border_color   #868686
bell_border_color       #e67e80

active_tab_foreground   #cccccc
active_tab_background   #545454
active_tab_font_style   bold
inactive_tab_foreground #868686
inactive_tab_background #474747
inactive_tab_font_style normal
tab_bar_background      #333333
tab_bar_margin_color    #333333

# Overlays kitty draws itself (hints, the unicode kitten, confirmations).
mark1_foreground #333333
mark1_background #cccccc
mark2_foreground #333333
mark2_background #9a9a9a
mark3_foreground #333333
mark3_background #868686
