monitor.bluez.properties = {
  # SBC-XQ removed 2026-08-29. The A2DP codec *switch* to it was intermittently
  # rejected by the Nothing Headphone (avdtp SET_CONFIGURATION "Configuration not
  # supported (41)"), and BlueZ does not fall back to plain SBC — it tears the A2DP
  # transport down, leaving either mono-8kHz HFP or a card with no nodes at all.
  # Plain SBC is negotiated at connect time and never switches, so it can't fail.
  bluez5.enable-sbc-xq = false

  # Wideband speech for calls (Google Meet). The previous codec list contained only
  # A2DP codecs, which silently disabled every HFP codec except CVSD — pinning calls
  # to 8kHz narrowband. lc3_swb (super-wideband) preferred, msbc next, cvsd last.
  bluez5.enable-msbc = true

  # AAC still deliberately excluded — historically the glitchiest path on this box.
  bluez5.codecs = [ sbc msbc lc3_swb cvsd ]
}
