keymap = """
    xkb_keymap {
        xkb_keycodes { include "evdev+aliases(qwerty)" };
        xkb_types    { include "complete"              };
        xkb_compat   { include "complete"              };
        xkb_symbols  { include "pc+us+inet(evdev)"     };
    };
    """

on-graphics-initialized = [
    # Must run first: exports WAYLAND_DISPLAY/DISPLAY into systemd + dbus so
    # xdg-desktop-portal (and the browser it launches for OAuth links) works.
    { type = "exec", exec = "jay-session-env" },
    { type = "exec", exec = "mako" },
    { type = "exec", exec = "wl-tray-bridge" },
]


auto-reload = true

show-bar = true

repeat-rate = { rate = 75, delay = 200 }
idle.minutes = 0

# Status bar text (right side of the bar). Ticks exactly on the minute:
# sleeps `60 - current_second` instead of a flat 60s, so it never drifts.
# NOTE: `shell = ...` would run under $SHELL, which is fish here, and fish
# has no `while ...; do ...; done`. So call sh explicitly.
[status]
format = "plain"
exec = { prog = "sh", args = [
    "-c",
    "while :; do date '+%a %d %b  %H:%M'; sleep $((60 - $(date +%S))); done",
] }

[xwayland]
enabled = true
scaling-mode = "default"

[shortcuts]
logo-shift-r = "reload-config-toml"

logo-t = { type = "exec", exec = "ghostty" }
logo-b = { type = "exec", exec = "glide-bin" }
logo-s = { type = "exec", exec = "slack" }

logo-d = "close"

logo-h = "focus-left"
logo-j = "focus-down"
logo-k = "focus-up"
logo-l = "focus-right"

logo-ctrl-h = "move-left"
logo-ctrl-j = "move-down"
logo-ctrl-k = "move-up"
logo-ctrl-l = "move-right"

logo-shift-h = { type = "resize", dx1 = -100, dx2 = -100 }
logo-shift-l = { type = "resize", dx1 = 100, dx2 = 100 }
logo-shift-j = { type = "resize", dy1 = 100, dy2 = 100 }
logo-shift-k = { type = "resize", dy1 = -100, dy2 = -100 }

logo-shift-t = "toggle-split"
logo-shift-m = "toggle-mono"
logo-shift-f = "toggle-floating"
logo-shift-a = "toggle-fullscreen"

logo-1 = { type = "show-workspace", name = "1" }
logo-2 = { type = "show-workspace", name = "2" }
logo-3 = { type = "show-workspace", name = "3" }
logo-4 = { type = "show-workspace", name = "4" }
logo-5 = { type = "show-workspace", name = "5" }

logo-ctrl-1 = { type = "move-to-workspace", name = "1" }
logo-ctrl-2 = { type = "move-to-workspace", name = "2" }
logo-ctrl-3 = { type = "move-to-workspace", name = "3" }
logo-ctrl-4 = { type = "move-to-workspace", name = "4" }
logo-ctrl-5 = { type = "move-to-workspace", name = "5" }

alt-s = { type = "toggle-overlay", name = "scratchpad" }

logo-shift-s = {
    type = "exec",
    exec = {
        shell = "grim -g \"$(slurp)\" \"$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png\"",
    },
}

logo-c = {
    type = "exec",
    exec = {
        prog = "wtype",
        args = ["-M", "ctrl", "-k", "c", "-m", "ctrl"],
        tag = "wtype",
    },
}


[[clients]]
match.tag = "pp-clipboard"
capabilities = ["data-control"]

[[clients]]
match.any = [
    { comm = "grim" },
    { comm = "slurp" },
]
capabilities = ["screencopy", "layer-shell"]

[theme]
bg-color = "#dfdbcd"
bar-bg-color = "#fffaea"
border-color = "#c0bcb0"
separator-color = "#c0bcb0"
unfocused-title-bg-color = "#efeadb"
unfocused-title-text-color = "#686661"
focused-title-bg-color = "#dfdbcd"
focused-title-text-color = "#282826"
show-window-icons = false
bar-position = "bottom"
font = "GeistMono NF Bold 12"
bar-status-text-color = "#282826"
focused-border-color = "#282826"
focused-inactive-title-bg-color = "#dfdbcd"
focused-inactive-title-text-color = "#41403c"
attention-requested-bg-color = "#833f39"
captured-focused-title-bg-color = "#8f6737"
captured-unfocused-title-bg-color = "#8f6737"
highlight-color = "#28282633"

[[windows]]
match.title-regex = "^feh"
initial-tile-state = "floating"

[[inputs]]
match.is-pointer = true
accel-profile = "flat"
accel-speed = 0.0
