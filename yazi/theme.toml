# e-ink for Yazi. GENERATED from ~/.config/theme/eink-dark.toml by build.py -- do not edit by hand

[mgr]
cwd = { fg = "#e3e3e1", bold = true }
find_keyword = { fg = "#e3e3e1", bg = "#3a3830", bold = true }
find_position = { fg = "#a7a5a1", bg = "#2e2b24" }
symlink_target = { fg = "#a7a5a1", italic = true }
marker_copied = { fg = "#17150d", bg = "#a7a5a1", bold = true }
marker_cut = { fg = "#17150d", bg = "#c5c4c0", bold = true }
marker_marked = { fg = "#e3e3e1", bg = "#3a3830", bold = true }
marker_selected = { fg = "#17150d", bg = "#e3e3e1", bold = true }
count_copied = { fg = "#17150d", bg = "#a7a5a1", bold = true }
count_cut = { fg = "#17150d", bg = "#c5c4c0", bold = true }
count_selected = { fg = "#17150d", bg = "#e3e3e1", bold = true }
border_symbol = "│"
border_style = { fg = "#46443d" }

[indicator]
parent = { reversed = true, bold = true }
current = { reversed = true, bold = true }
preview = { fg = "#989792" }
padding = { open = "▐", close = "▌" }

[tabs]
active = { fg = "#17150d", bg = "#e3e3e1", bold = true }
inactive = { fg = "#a7a5a1", bg = "#2e2b24" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#17150d", bg = "#e3e3e1", bold = true }
normal_alt = { fg = "#a7a5a1", bg = "#2e2b24" }
select_main = { fg = "#17150d", bg = "#c5c4c0", bold = true }
select_alt = { fg = "#a7a5a1", bg = "#2e2b24" }
unset_main = { fg = "#17150d", bg = "#a7a5a1", bold = true }
unset_alt = { fg = "#a7a5a1", bg = "#2e2b24" }

[status]
overall = { fg = "#c5c4c0", bg = "#222018" }
sep_left = { open = "", close = " " }
sep_right = { open = " ", close = "" }
perm_type = { fg = "#a7a5a1" }
perm_read = { fg = "#c5c4c0" }
perm_write = { fg = "#a7a5a1" }
perm_exec = { fg = "#e3e3e1", bold = true }
perm_sep = { fg = "#46443d" }
progress_label = { fg = "#e3e3e1", bold = true }
progress_normal = { fg = "#a7a5a1", bg = "#3a3830" }
progress_error = { fg = "#e88b82", bg = "#3a3830", bold = true }

[which]
cols = 2
mask = { fg = "#989792" }
cand = { fg = "#e3e3e1", bold = true }
rest = { fg = "#a7a5a1" }
desc = { fg = "#c5c4c0" }
separator = " → "
separator_style = { fg = "#46443d" }

[confirm]
border = { fg = "#46443d" }
title = { fg = "#e3e3e1", bold = true }
body = { fg = "#c5c4c0" }
list = { fg = "#a7a5a1" }
btn_yes = { fg = "#17150d", bg = "#e3e3e1", bold = true }
btn_no = { fg = "#e3e3e1", bg = "#3a3830" }
btn_labels = [ "Yes", "No" ]

[spot]
border = { fg = "#46443d" }
title = { fg = "#e3e3e1", bold = true }
tbl_col = { fg = "#e3e3e1", bg = "#3a3830", bold = true }
tbl_cell = { fg = "#c5c4c0", bg = "#222018" }

[notify]
title_info = { fg = "#e3e3e1", bold = true }
title_warn = { fg = "#a97a41", bold = true }
title_error = { fg = "#e88b82", bold = true, underline = true }

[pick]
border = { fg = "#46443d" }
active = { fg = "#e3e3e1", bg = "#2e2b24", bold = true }
inactive = { fg = "#c5c4c0" }

[input]
border = { fg = "#46443d" }
title = { fg = "#e3e3e1", bold = true }
value = { fg = "#c5c4c0" }
selected = { fg = "#e3e3e1", bg = "#3a3830", bold = true }

[cmp]
border = { fg = "#46443d" }
active = { fg = "#e3e3e1", bg = "#2e2b24", bold = true }
inactive = { fg = "#c5c4c0" }

[tasks]
border = { fg = "#46443d" }
title = { fg = "#e3e3e1", bold = true }
hovered = { fg = "#e3e3e1", bg = "#2e2b24", bold = true }

[help]
on = { fg = "#e3e3e1", bold = true }
run = { fg = "#c5c4c0" }
desc = { fg = "#a7a5a1" }
hovered = { fg = "#e3e3e1", bg = "#2e2b24", bold = true }
footer = { fg = "#a7a5a1", italic = true }
icon_info = "i"
icon_warn = "!"
icon_error = "×"

[filetype]
rules = [
    { url = "*/", fg = "#e3e3e1", bold = true },
    { url = "*", fg = "#c5c4c0" },
]

# Neutral glyphs instead of coloured devicons -- a panel has no hues to spend.
[icon]
globs = []
dirs = []
files = []
exts = []
conds = [
    { if = "orphan", text = "", fg = "#989792" },
    { if = "link", text = "", fg = "#a7a5a1" },
    { if = "hidden & dir", text = "", fg = "#c5c4c0" },
    { if = "dir", text = "", fg = "#e3e3e1" },
    { if = "exec", text = "󰆍", fg = "#e3e3e1" },
    { if = "block | char | fifo | sock", text = "󰜫", fg = "#a7a5a1" },
    { if = "!(dir | link)", text = "󰈔", fg = "#c5c4c0" },
]
